name: Performance Metrics

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  performance-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
        
      - name: Build application
        run: npm run build
        timeout-minutes: 3
        
      - name: Start dev server (PR branch)
        run: npm start &
        
      - name: Wait for server
        run: npx wait-on http://localhost:4444 --timeout 30000
        
      - name: Run metrics on PR branch
        run: node Puppet/metrics.js > pr-metrics.json
        timeout-minutes: 5
        
      - name: Stop dev server
        run: pkill -f vite || true
        
      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          clean: false
          
      - name: Install dependencies (base)
        run: npm ci --legacy-peer-deps
        
      - name: Build application (base)
        run: npm run build
        timeout-minutes: 3
        
      - name: Start dev server (base branch)
        run: npm start &
        
      - name: Wait for server (base)
        run: npx wait-on http://localhost:4444 --timeout 30000
        
      - name: Run metrics on base branch
        run: node Puppet/metrics.js > base-metrics.json
        timeout-minutes: 5
        
      - name: Stop dev server (base)
        run: pkill -f vite || true
        
      - name: Parse and compare metrics
        id: compare
        run: |
          node -e "
          const fs = require('fs');
          
          // Read the output files
          const prOutput = fs.readFileSync('pr-metrics.json', 'utf8');
          const baseOutput = fs.readFileSync('base-metrics.json', 'utf8');
          
          // Extract JSON from output (it's after 'JSON OUTPUT' line)
          const extractJson = (text) => {
            const jsonStart = text.indexOf('[');
            const jsonEnd = text.lastIndexOf(']') + 1;
            return JSON.parse(text.slice(jsonStart, jsonEnd));
          };
          
          const prMetrics = extractJson(prOutput);
          const baseMetrics = extractJson(baseOutput);
          
          // Generate markdown table
          let markdown = '## Performance Metrics Comparison\n\n';
          markdown += '| Project | Metric | Base | PR | Change |\n';
          markdown += '|---------|--------|------|----|---------|\n';
          
          prMetrics.forEach((prM, idx) => {
            const baseM = baseMetrics[idx];
            if (!baseM || prM.projectName !== baseM.projectName) return;
            
            // Cold load time comparison
            const loadDiff = prM.coldLoadTimeMs - baseM.coldLoadTimeMs;
            const loadPct = ((loadDiff / baseM.coldLoadTimeMs) * 100).toFixed(1);
            const loadEmoji = loadDiff > 0 ? '⚠️' : '✅';
            markdown += \`| \${prM.projectName} | Cold Load | \${baseM.coldLoadTimeMs}ms | \${prM.coldLoadTimeMs}ms | \${loadEmoji} \${loadDiff > 0 ? '+' : ''}\${loadDiff}ms (\${loadPct}%) |\n\`;
            
            // Cache size comparison
            const sizeDiff = prM.cacheSize - baseM.cacheSize;
            const sizePct = ((sizeDiff / baseM.cacheSize) * 100).toFixed(1);
            const sizeEmoji = sizeDiff > 0 ? '⚠️' : '✅';
            markdown += \`| \${prM.projectName} | Cache Size | \${baseM.cacheSizeFormatted} | \${prM.cacheSizeFormatted} | \${sizeEmoji} \${sizeDiff > 0 ? '+' : ''}\${(sizeDiff / 1024).toFixed(1)}KB (\${sizePct}%) |\n\`;
          });
          
          markdown += '\n---\n';
          markdown += '*Cold load time includes full page load + rendering + cache write*\n';
          markdown += '*Cache size is IndexedDB storage for serialized geometry*\n';
          
          // Write to file for comment step
          fs.writeFileSync('metrics-comment.md', markdown);
          "
          
      - name: Comment PR with metrics
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('metrics-comment.md', 'utf8');
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            
            const botComment = comments.find(c => 
              c.user.type === 'Bot' && c.body.includes('Performance Metrics Comparison')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }