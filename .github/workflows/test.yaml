# Simple workflow for running puppeteer tests on pull requests
name: Puppeteer Tests

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, closed]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "puppeteer-screenshot-tests"
  cancel-in-progress: false # Do not cancel in-progress tests if a new one is triggered

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Configure AWS credentials for cleanup
        uses: aws-actions/configure-aws-credentials@v5
        if: env.AWS_ACCESS_KEY_ID != ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      - name: Cleanup S3 screenshots
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          S3_BUCKET="${{ secrets.S3_BUCKET_NAME }}"
          PR_PREFIX="pr-${{ github.event.number }}/"

          echo "Cleaning up S3 screenshots for PR #${{ github.event.number }}"

          # List and delete all objects with the PR prefix
          aws s3 rm "s3://$S3_BUCKET/$PR_PREFIX" --recursive

          echo "S3 cleanup completed for s3://$S3_BUCKET/$PR_PREFIX"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      - name: Cleanup completed
        run: |
          echo "PR #${{ github.event.number }} closed - cleanup completed"

  test:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch_name: base
            ref: ${{ github.event.pull_request.base.ref }}
          - branch_name: pr
            ref: ${{ github.head_ref }}
    steps:
      - name: Checkout ${{ matrix.branch_name }} branch
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ matrix.ref }}
      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory /github/workspace
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Puppeteer Chromium
        run: npx puppeteer install
      - name: build
        run: npm run build
      - name: Start server
        run: npm start &
      - name: Wait for server
        run: |
          echo "Waiting for server to start..."
          timeout 30 bash -c 'until curl -s http://localhost:4444 > /dev/null; do sleep 1; done'
      - name: Run Tests
        run: npm test
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        if: always() && env.AWS_ACCESS_KEY_ID != ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      - name: Upload screenshots to S3
        if: always() && env.AWS_ACCESS_KEY_ID != ''
        run: |
          # Create unique folder for this PR, branch, and run
          S3_FOLDER="pr-${{ github.event.number }}/${{ matrix.branch_name }}-run-${{ github.run_number }}"
          S3_BUCKET="${{ secrets.S3_BUCKET_NAME }}"

          # Upload all screenshot files to S3
          for file in Puppet/images/*.png; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              aws s3 cp "$file" "s3://$S3_BUCKET/$S3_FOLDER/$filename" --content-type "image/png"
              echo "Uploaded: $filename to s3://$S3_BUCKET/$S3_FOLDER/$filename"
            fi
          done

          # Store S3 info for later steps
          echo "S3_BUCKET=$S3_BUCKET" >> $GITHUB_ENV
          echo "S3_FOLDER=$S3_FOLDER" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      - name: Upload screenshots as artifacts (fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puppeteer-screenshots-${{ matrix.branch_name }}
          path: Puppet/images/*.png
      - name: Create screenshot comparison comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request_target' && matrix.branch_name == 'pr'
        with:
          script: |
            const fs = require('fs');
            const screenshotDir = 'Puppet/images';
            let files = [];
            try {
              files = fs.readdirSync(screenshotDir).filter(file => file.endsWith('.png'));
            } catch (e) {
              console.log('Screenshot directory not found or empty');
            }
            const s3Bucket = process.env.S3_BUCKET;
            const s3Folder = process.env.S3_FOLDER;
            const hasS3 = s3Bucket && s3Folder;
            let comment = '## 📸 Puppeteer Test Screenshots\n\n';
            comment += `Screenshots from commit: ${context.sha.substring(0, 7)}\n\n`;
            if (files.length === 0) {
              comment += 'No screenshots were generated.';
            } else {
              comment += `Generated ${files.length} screenshot(s):\n\n`;
              // Group screenshots by project
              const projectScreenshots = {};
              const otherScreenshots = [];
              files.forEach(file => {
                if (file.includes('-Test.png') || file.includes('-Deployed.png')) {
                  let projectName;
                  if (file.includes('-Test.png')) {
                    projectName = file.replace('-Test.png', '');
                  } else if (file.includes('-Deployed.png')) {
                    projectName = file.replace('-Deployed.png', '');
                  }
                  if (!projectScreenshots[projectName]) {
                    projectScreenshots[projectName] = {};
                  }
                  if (file.includes('-Test.png')) {
                    projectScreenshots[projectName].test = file;
                  } else if (file.includes('-Deployed.png')) {
                    projectScreenshots[projectName].deployed = file;
                  }
                } else {
                  otherScreenshots.push(file);
                }
              });
              // Display main
              if (otherScreenshots.length > 0) {
                comment += `### Two Project Comparison\n\n`;
                if (hasS3) {
                  const baseS3Url = `https://${s3Bucket}.s3.amazonaws.com/${s3Folder}`;
                  otherScreenshots.forEach(file => {
                    comment += `**${file}**\n\n![${file}](${baseS3Url}/${file})\n\n`;
                  });
                } else {
                  otherScreenshots.forEach(file => {
                    comment += `- \`${file}\`\n`;
                  });
                  comment += '\n';
                }
              }
              if (hasS3) {
                comment += `\n**📁 S3 Location:** Screenshots are stored in \`${s3Bucket}/${s3Folder}/\`\n\n`;
              } else {
                comment += '**📁 Download Screenshots:** All screenshots are available in the [workflow artifacts]';
                comment += `(https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) `;
                comment += 'for this workflow run. Click "Summary" then download the "puppeteer-screenshots" artifact.\n\n';
              }
              comment += '*Note: S3 images are automatically cleaned up after 30 days. Workflow artifacts are cleaned up after 90 days by GitHub.*';
            }
            // Now update or create the comment (must be last)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('📸 Puppeteer Test Screenshots')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
  # Measures the base and PR builds on the same runner, alternating between
  # them, so the comparison isn't skewed by the two landing on different
  # machines. Runs PR code, so it gets a read-only token and posts nothing;
  # comment-performance posts the report it produces.
  metrics:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    permissions:
      contents: read
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: pr
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the base the PR branched from
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          # Compare against the merge base, not the base branch's latest
          # commit, so changes merged to the base since the PR branched
          # aren't counted as the PR's.
          BASE_SHA=$(git -C pr merge-base "origin/$BASE_REF" HEAD)
          git -C pr worktree add ../base "$BASE_SHA"
          echo "BASE_SHA=$BASE_SHA" >> $GITHUB_ENV
          echo "PR_SHA=$(git -C pr rev-parse HEAD)" >> $GITHUB_ENV
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: |
            pr/package-lock.json
            base/package-lock.json
      - name: Build base
        working-directory: base
        run: npm ci --legacy-peer-deps && npm run build
      - name: Build PR
        working-directory: pr
        run: npm ci --legacy-peer-deps && npm run build
      - name: Install Puppeteer Chromium
        working-directory: pr
        run: npx puppeteer install
      - name: Serve both builds
        run: |
          (cd base && npx vite preview --port 4445 --strictPort > ../preview-base.log 2>&1 &)
          (cd pr && npx vite preview --port 4446 --strictPort > ../preview-pr.log 2>&1 &)
          timeout 60 bash -c 'until curl -sf http://localhost:4445 > /dev/null && curl -sf http://localhost:4446 > /dev/null; do sleep 1; done'
      - name: Run performance metrics
        working-directory: pr
        run: >
          node Puppet/metrics.js
          --target base=http://localhost:4445
          --target pr=http://localhost:4446
          --runs 7
          --out ../metrics.json
        timeout-minutes: 40
      - name: Build performance report
        if: always() && hashFiles('metrics.json') != ''
        working-directory: pr
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || 'main' }}
        run: |
          npm install --no-save --legacy-peer-deps jest-diff
          node Puppet/compareMetrics.js ../metrics.json \
            --base-label "$BASE_REF at ${BASE_SHA::7}" \
            --pr-label "${PR_SHA::7}" \
            --out ../performance-report.md
          cat ../performance-report.md >> $GITHUB_STEP_SUMMARY
      - name: Upload metrics and report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-metrics
          path: |
            metrics.json
            performance-report.md
          if-no-files-found: ignore

  comment-performance:
    needs: metrics
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && github.event.action != 'closed'
    steps:
      - name: Download report
        uses: actions/download-artifact@v4
        with:
          name: performance-metrics
          path: ./metrics
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const markdown = fs.readFileSync('metrics/performance-report.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Performance Metrics Comparison')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: markdown
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: markdown
              });
            }
