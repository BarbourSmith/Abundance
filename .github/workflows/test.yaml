# Simple workflow for running puppeteer tests on pull requests
name: Puppeteer Tests

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, closed]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets the GITHUB_TOKEN permissions to allow deployment to GitHub Pages
permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "puppeteer-screenshot-tests"
  cancel-in-progress: false # Do not cancel in-progress tests if a new one is triggered

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - name: Configure AWS credentials for cleanup
        uses: aws-actions/configure-aws-credentials@v4
        if: env.AWS_ACCESS_KEY_ID != ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      - name: Cleanup S3 screenshots
        if: env.AWS_ACCESS_KEY_ID != ''
        run: |
          S3_BUCKET="${{ secrets.S3_BUCKET_NAME }}"
          PR_PREFIX="pr-${{ github.event.number }}/"

          echo "Cleaning up S3 screenshots for PR #${{ github.event.number }}"

          # List and delete all objects with the PR prefix
          aws s3 rm "s3://$S3_BUCKET/$PR_PREFIX" --recursive

          echo "S3 cleanup completed for s3://$S3_BUCKET/$PR_PREFIX"
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      - name: Cleanup completed
        run: |
          echo "PR #${{ github.event.number }} closed - cleanup completed"

  test:
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    strategy:
      matrix:
        include:
          - branch_name: base
            ref: ${{ github.event.pull_request.base.ref }}
          - branch_name: pr
            ref: ${{ github.head_ref }}
    steps:
      - name: Checkout ${{ matrix.branch_name }} branch
        uses: actions/checkout@v4.2.2
        with:
          ref: ${{ matrix.ref }}
      - name: Configure Git Safe Directory
        run: |
          git config --global --add safe.directory /github/workspace
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Install Puppeteer Chromium
        run: npx puppeteer install
      - name: build
        run: npm run build
      - name: Start server
        run: npm start &
      - name: Wait for server
        run: |
          echo "Waiting for server to start..."
          timeout 30 bash -c 'until curl -s http://localhost:4444 > /dev/null; do sleep 1; done'
      - name: Run performance metrics
        run: node Puppet/metrics.js > metrics-${{ matrix.branch_name }}.json
        timeout-minutes: 5
      - name: Upload metrics as artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-metrics-${{ matrix.branch_name }}
          path: metrics-${{ matrix.branch_name }}.json
      - name: Run Tests
        run: npm test
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        if: always() && env.AWS_ACCESS_KEY_ID != ''
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      - name: Upload screenshots to S3
        if: always() && env.AWS_ACCESS_KEY_ID != ''
        run: |
          # Create unique folder for this PR, branch, and run
          S3_FOLDER="pr-${{ github.event.number }}/${{ matrix.branch_name }}-run-${{ github.run_number }}"
          S3_BUCKET="${{ secrets.S3_BUCKET_NAME }}"

          # Upload all screenshot files to S3
          for file in Puppet/images/*.png; do
            if [ -f "$file" ]; then
              filename=$(basename "$file")
              aws s3 cp "$file" "s3://$S3_BUCKET/$S3_FOLDER/$filename" --content-type "image/png"
              echo "Uploaded: $filename to s3://$S3_BUCKET/$S3_FOLDER/$filename"
            fi
          done

          # Store S3 info for later steps
          echo "S3_BUCKET=$S3_BUCKET" >> $GITHUB_ENV
          echo "S3_FOLDER=$S3_FOLDER" >> $GITHUB_ENV
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      - name: Upload screenshots as artifacts (fallback)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: puppeteer-screenshots-${{ matrix.branch_name }}
          path: Puppet/images/*.png
      - name: Create screenshot comparison comment
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request_target' && matrix.branch_name == 'pr'
        with:
          script: |
            const fs = require('fs');
            const screenshotDir = 'Puppet/images';
            let files = [];
            try {
              files = fs.readdirSync(screenshotDir).filter(file => file.endsWith('.png'));
            } catch (e) {
              console.log('Screenshot directory not found or empty');
            }
            const s3Bucket = process.env.S3_BUCKET;
            const s3Folder = process.env.S3_FOLDER;
            const hasS3 = s3Bucket && s3Folder;
            let comment = '## 📸 Puppeteer Test Screenshots\n\n';
            comment += `Screenshots from commit: ${context.sha.substring(0, 7)}\n\n`;
            if (files.length === 0) {
              comment += 'No screenshots were generated.';
            } else {
              comment += `Generated ${files.length} screenshot(s):\n\n`;
              // Group screenshots by project
              const projectScreenshots = {};
              const otherScreenshots = [];
              files.forEach(file => {
                if (file.includes('-Test.png') || file.includes('-Deployed.png')) {
                  let projectName;
                  if (file.includes('-Test.png')) {
                    projectName = file.replace('-Test.png', '');
                  } else if (file.includes('-Deployed.png')) {
                    projectName = file.replace('-Deployed.png', '');
                  }
                  if (!projectScreenshots[projectName]) {
                    projectScreenshots[projectName] = {};
                  }
                  if (file.includes('-Test.png')) {
                    projectScreenshots[projectName].test = file;
                  } else if (file.includes('-Deployed.png')) {
                    projectScreenshots[projectName].deployed = file;
                  }
                } else {
                  otherScreenshots.push(file);
                }
              });
              // Display main
              if (otherScreenshots.length > 0) {
                comment += `### Two Project Comparison\n\n`;
                if (hasS3) {
                  const baseS3Url = `https://${s3Bucket}.s3.amazonaws.com/${s3Folder}`;
                  otherScreenshots.forEach(file => {
                    comment += `**${file}**\n\n![${file}](${baseS3Url}/${file})\n\n`;
                  });
                } else {
                  otherScreenshots.forEach(file => {
                    comment += `- \`${file}\`\n`;
                  });
                  comment += '\n';
                }
              }
              if (hasS3) {
                comment += `\n**📁 S3 Location:** Screenshots are stored in \`${s3Bucket}/${s3Folder}/\`\n\n`;
              } else {
                comment += '**📁 Download Screenshots:** All screenshots are available in the [workflow artifacts]';
                comment += `(https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}) `;
                comment += 'for this workflow run. Click "Summary" then download the "puppeteer-screenshots" artifact.\n\n';
              }
              comment += '*Note: S3 images are automatically cleaned up after 30 days. Workflow artifacts are cleaned up after 90 days by GitHub.*';
            }
            // Now update or create the comment (must be last)
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.data.find(comment => 
              comment.user.type === 'Bot' && comment.body.includes('📸 Puppeteer Test Screenshots')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
            }
  compare-and-comment:
    needs: test
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Download base metrics
        uses: actions/download-artifact@v4
        with:
          name: performance-metrics-base
          path: ./base
      - name: Download PR metrics
        uses: actions/download-artifact@v4
        with:
          name: performance-metrics-pr
          path: ./pr
      - name: Compare metrics and comment
        uses: actions/github-script@v7
        if: always()
        with:
          script: |
            const fs = require('fs');

            const prOutput = fs.readFileSync('pr/metrics-pr.json', 'utf8');
            const baseOutput = fs.readFileSync('base/metrics-base.json', 'utf8');

            const extractJson = (text) => {
              const jsonStart = text.indexOf('[');
              const jsonEnd = text.lastIndexOf(']') + 1;
              if (jsonStart === -1 || jsonEnd === 0) return [];
              return JSON.parse(text.slice(jsonStart, jsonEnd));
            };

            const keyByName = (metricsArray) => {
              const result = {};
              metricsArray.forEach((m) => {
                result[m.projectName] = m;
              });
              return result;
            };

            const formatBytes = (bytes) => {
              if (bytes === 0) return "0 Bytes";
              const k = 1024;
              const sizes = ["Bytes", "KB", "MB", "GB", "TB"];
              const i = Math.min(
                Math.floor(Math.log(bytes) / Math.log(k)),
                sizes.length - 1
              );
              return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + " " + sizes[i];
            }

            const safePercent = (pr, base) => {
              if (base === 0) return 'N/A';
              return (((pr - base) / base) * 100).toFixed(1);
            }

            const baseMetrics = keyByName(extractJson(baseOutput));
            const prMetrics = keyByName(extractJson(prOutput));

            const metricsAllowList = [
              'coldLoadTimeMs',
              'warmLoadTimeMs',
              'cacheSize',
              'cacheEntryCount',
              'projectFileSize',
            ];

            let markdown = '## ⚡ Performance Metrics Comparison\n\n';
            markdown += `| ProjectName | ${metricsAllowList.join(" | ")} |\n`;
            markdown += `| --- | ${metricsAllowList.map(() => '------------').join(' | ')} |\n`;


            Object.keys(prMetrics).forEach((projectName) => {
              const prM = prMetrics[projectName];
              const baseM = baseMetrics[projectName];
              if (!baseM) return;

              markdown += `| ${projectName} `;
              metricsAllowList.forEach((key) => {
                const prValue = prM[key];
                const baseValue = baseM[key];
                const diff = prValue - baseValue;
                const pct = safePercent(prValue, baseValue);
                const emoji = key.endsWith("TimeMs") ?
                  (pct != 'N/A' && pct < 20 ? '✅' : '⚠️') :
                  (diff <= 0 ? '✅' : '⚠️');
                if (key.endsWith("Size")) {
                  markdown += `| ${formatBytes(baseValue)} → ${formatBytes(prValue)}<br> ${emoji} ${diff >= 0 ? '+' : '-'}${formatBytes(Math.abs(diff))} (${pct}%) `;
                } else {
                  markdown += `| ${baseValue} → ${prValue}<br> ${emoji} ${diff > 0 ? '+' : ''}${diff} (${pct}%) `;
                }
              });
              markdown += '|\n';
            });
            markdown += '\n---\n';

            console.log(markdown);

            const prNumber = context.issue.number;
            if (!prNumber) {
              console.log("No PR number found in context, skipping comment.");
              return;
            }
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Performance Metrics Comparison')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: markdown
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: markdown
              });
            }
