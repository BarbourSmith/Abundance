# Tests for the local AI agent bridge (bridge/ and src/agent/).
# Runs on plain pull_request with read-only permissions: it needs no secrets.
name: Agent Bridge Tests

on:
  pull_request:
    branches: [main]
    paths:
      - "bridge/**"
      - "src/agent/**"
      - "src/js/undoCommands.js"
      - "src/js/globalvariables.js"
      - "src/js/meshPNGGenerator.js"
      - "src/molecules/code.js"
      - "src/components/secondary/AgentBridge.jsx"
      - "tests/agent-runtime.test.js"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/agent-bridge.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bridge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
      - name: Install dependencies
        run: npm ci --legacy-peer-deps
      - name: Bridge unit tests (Node)
        run: npm run test:bridge
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Runtime tests (headless browser)
        run: npx vitest run --config=vitest.headless.config.ts tests/agent-runtime.test.js
      - name: Start dev server
        run: npm start &
      - name: Wait for dev server
        run: timeout 60 bash -c 'until curl -s http://localhost:4444 > /dev/null; do sleep 1; done'
      - name: End-to-end bridge test against a public project
        run: npm run test:bridge:e2e
